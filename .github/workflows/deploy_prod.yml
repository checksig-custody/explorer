name: '[Prod] Deployment'
on:
  # Trigger 1: automatic on publishing a GitHub Release.
  release:
    types: [published]

  # Trigger 2: manual re-deploy / recovery of an existing tag
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to deploy (e.g., prod-2026.01.15)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-explorer:
    environment: Production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # assume the explorer deploy role in AWS
    # Serialize deploys to the same bucket/distribution; never cancel an S3
    # sync mid-flight.
    concurrency:
      group: deploy-prod-explorer
      cancel-in-progress: false
    steps:
      - name: Validate tag
        id: resolve
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG:-$DISPATCH_TAG}"
          if [[ ! "$TAG" =~ ^prod-[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-[0-9]+)?$ ]]; then
            echo "ERROR: Tag '$TAG' does not match expected format 'prod-YYYY.MM.DD' or 'prod-YYYY.MM.DD-N'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Deploy exactly the tagged commit on both the release and the
          # manual-dispatch paths (dispatch would otherwise default to master).
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # Output ExplorerDeployerRoleArn of the checksig-token stack
          # ChecksigTestnetExplorer; trusts only this repo's Production env.
          role-to-assume: ${{ vars.EXPLORER_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      - run: corepack enable

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'yarn'

      # Builds, syncs dist/ to the ChecksigTestnetExplorer bucket and
      # invalidates CloudFront (identifiers resolved from the stack outputs).
      - name: Build and deploy explorer
        run: bash scripts/deploy.sh
