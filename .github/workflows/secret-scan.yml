# Copy of checksig-custody/.github/.github/workflows/reusable-secret-scan.yml
# (at bad2f99, 2026-10-16), inlined because this repository is public and
# GitHub does not let a public repository call a reusable workflow from the
# internal .github repository: every call failed at start and the required
# "secret-scan / gitleaks" check never reported (checksig-custody/.github#110).
#
# Keep it aligned with the reusable workflow: when that one changes (gitleaks
# version, checkout pin, scan arguments), apply the same change here. Go back
# to calling it once #110 makes it reachable from public repositories.
#
# The job name is the required status check, so it must stay "secret-scan / gitleaks".
# A .gitleaks.toml or .gitleaksignore at the repository root is used.
# Merge commits on the pull request branch are not scanned.

name: Secret scan

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: secret-scan / gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          dir="$(mktemp -d)"
          curl -fsSL -o "${dir}/${archive}" "${base}/${archive}"
          curl -fsSL -o "${dir}/checksums.txt" "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # The checksums file of the release must list the digest written here.
          grep -Fx "${GITLEAKS_SHA256}  ${archive}" "${dir}/checksums.txt"
          echo "${GITLEAKS_SHA256}  ${dir}/${archive}" | sha256sum --check
          tar -xzf "${dir}/${archive}" -C "${dir}" gitleaks
          mkdir -p "${RUNNER_TEMP}/bin"
          mv "${dir}/gitleaks" "${RUNNER_TEMP}/bin/gitleaks"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Scan with gitleaks
        env:
          FULL_HISTORY: ${{ github.event_name != 'pull_request' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # --verbose is not used: it prints the extra matches of composite rules in clear.
          args=(--redact --no-banner --no-color --exit-code 1 --report-format csv --report-path -)
          if [ "${FULL_HISTORY}" = "true" ]; then
            echo "Scanning the full history"
          elif [ -n "${BASE_SHA}" ] && [ -n "${HEAD_SHA}" ]; then
            echo "Scanning ${BASE_SHA}..${HEAD_SHA}"
            args+=(--log-opts="${BASE_SHA}..${HEAD_SHA}")
          else
            echo "::error::Not a pull request: set full-history to scan the whole history."
            exit 2
          fi
          gitleaks git "${args[@]}" .
